name: leximate

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    container_name: leximate-db
    ports:
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '-c max_connections=100 -c shared_buffers=256MB'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - leximate-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: leximate-backend
    restart: no
    expose:
      - '8080'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leximate-network
    command: npm run start:dev
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    container_name: leximate-nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - leximate-network

  n8n:
    image: n8nio/n8n:latest
    container_name: leximate-n8n
    restart: always
    ports:
      - '5678:5678'
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - DB_SQLITE_POOL_SIZE=5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leximate-network
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:

networks:
  leximate-network:
    driver: bridge
